version: "v1.0"
name: dato-rails
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
auto_cancel:
  running:
    when: "true"

blocks:
  - name: tests
    execution_time_limit:
      minutes: 10
    task:
      secrets:
        - name: dato-rails
      prologue:
        commands:
          - checkout --use-cache
          - sem-version ruby $(cat .ruby-version) -f
          - cache restore gems-$SEMAPHORE_AGENT_MACHINE_OS_IMAGE-$(cat .ruby-version)-$(checksum Gemfile.lock)
          - bundle config set path 'vendor/bundle'
          - bundle install -j 4
          - cache store gems-$SEMAPHORE_AGENT_MACHINE_OS_IMAGE-$(cat .ruby-version)-$(checksum Gemfile.lock) vendor/bundle
      jobs:
        - name: lint
          commands:
            - bin/fastcheck
        - name: check
          commands:
            - bin/check
promotions:
  - name: release
    pipeline_file: release.yml
    auto_promote:
      when: "result = 'passed' and tag =~ '^[0-9]+[.][0-9]+[.][0-9]+$'"
